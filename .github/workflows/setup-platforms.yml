name: Setup all platforms

# Дастӣ оғоз мешавад: Actions -> Setup all platforms -> Run workflow
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform folders
        run: |
          flutter create \
            --platforms=android,ios,windows,macos,linux,web \
            --project-name jarvis_ai \
            --org com.jarvis .
          # Кодҳои шумо бармегарданд, агар flutter create онҳоро тағйир дода бошад.
          git checkout -- lib test pubspec.yaml analysis_options.yaml

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Ҳеҷ тағйирот нест."
          else
            git commit -m "chore: generate platform folders"
            git push
          fi
