name: Setup all platforms

# Дастӣ оғоз мешавад: Actions -> Setup all platforms -> Run workflow
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform folders
        run: |
          flutter create \
            --platforms=android,ios,windows,macos,linux,web \
            --project-name jarvis_ai \
            --org com.jarvis .
          # Кодҳои шумо бармегарданд, агар flutter create онҳоро тағйир дода бошад.
          git checkout -- lib test pubspec.yaml analysis_options.yaml

      - name: Generate app icons
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Set app name to JARVIS AI
        run: |
          # Android
          f=android/app/src/main/AndroidManifest.xml
          [ -f "$f" ] && sed -i 's|android:label="[^"]*"|android:label="JARVIS AI"|' "$f"

          # iOS
          f=ios/Runner/Info.plist
          [ -f "$f" ] && perl -0pi -e 's|(<key>CFBundleDisplayName</key>\s*<string>)[^<]*|${1}JARVIS AI|' "$f"

          # Windows
          f=windows/runner/main.cpp
          [ -f "$f" ] && sed -i 's|L"jarvis_ai"|L"JARVIS AI"|' "$f"

          # Linux
          f=linux/runner/my_application.cc
          [ -f "$f" ] && sed -i 's|"jarvis_ai"|"JARVIS AI"|g' "$f"

          # Web
          for f in web/index.html web/manifest.json; do
            [ -f "$f" ] && sed -i 's|jarvis_ai|JARVIS AI|g' "$f"
          done
          true

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Ҳеҷ тағйирот нест."
          else
            git commit -m "chore: generate platform folders, icons and app name"
            git push
          fi
