name: Build JARVIS AI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  android:
    name: Android APK
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Ensure platform folder
        shell: bash
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name jarvis_ai --org com.jarvis .
            git checkout -- lib test pubspec.yaml analysis_options.yaml
          fi
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-ai-android-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  web:
    name: Web
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Ensure platform folder
        shell: bash
        run: |
          if [ ! -d web ]; then
            flutter create --platforms=web --project-name jarvis_ai --org com.jarvis .
            git checkout -- lib test pubspec.yaml analysis_options.yaml
          fi
      - run: flutter pub get
      - run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-ai-web
          path: build/web
          if-no-files-found: error

  windows:
    name: Windows
    needs: check
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Ensure platform folder
        shell: bash
        run: |
          if [ ! -d windows ]; then
            flutter create --platforms=windows --project-name jarvis_ai --org com.jarvis .
            git checkout -- lib test pubspec.yaml analysis_options.yaml
          fi
      - run: flutter pub get
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-ai-windows
          path: build/windows/x64/runner/Release
          if-no-files-found: error

  linux:
    name: Linux
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Ensure platform folder
        shell: bash
        run: |
          if [ ! -d linux ]; then
            flutter create --platforms=linux --project-name jarvis_ai --org com.jarvis .
            git checkout -- lib test pubspec.yaml analysis_options.yaml
          fi
      - run: flutter pub get
      - run: flutter build linux --release
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-ai-linux
          path: build/linux/x64/release/bundle
          if-no-files-found: error

  macos:
    name: macOS
    needs: check
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Ensure platform folder
        shell: bash
        run: |
          if [ ! -d macos ]; then
            flutter create --platforms=macos --project-name jarvis_ai --org com.jarvis .
            git checkout -- lib test pubspec.yaml analysis_options.yaml
          fi
      - run: flutter pub get
      - run: flutter build macos --release
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-ai-macos
          path: build/macos/Build/Products/Release
          if-no-files-found: error

  ios:
    name: iOS (unsigned)
    needs: check
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Ensure platform folder
        shell: bash
        run: |
          if [ ! -d ios ]; then
            flutter create --platforms=ios --project-name jarvis_ai --org com.jarvis .
            git checkout -- lib test pubspec.yaml analysis_options.yaml
          fi
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-ai-ios-unsigned
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: error
